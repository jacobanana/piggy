<!--
  The Piggy mark, and the source every other icon in this directory is rendered
  from (see frontend/scripts/make-icons.mjs).

  Drawn rather than set in emoji on purpose: the brand's pig is 🐷 in the
  topbar, but a home-screen icon rendered from a font is whatever font the
  machine that built it happened to have — Noto on CI, Apple Color Emoji on a
  laptop, a blank box on a bare container. A path is the same picture
  everywhere.

  It wears the app's own drawing style: flat fills, a heavy --ink outline, no
  gradient. The indigo ground is --accent from the default (blueberry) theme.
  A book on another theme keeps this icon; the tile is the product's mark, not
  the book's paint, and it is chosen once at install and never re-rendered.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Piggy">
  <title>Piggy</title>
  <!-- The two ids are the generator's handles: it squares the tile's corners
       and shrinks the mark to produce the maskable and Apple renderings from
       this one drawing, so there is no second copy of the pig to keep in step. -->
  <rect id="tile" width="512" height="512" rx="112" fill="#5A67E8"/>
  <g id="mark" stroke="#23264F" stroke-width="15" stroke-linejoin="round" stroke-linecap="round">
    <!-- Ears first, so the head's fill covers their inner edges. -->
    <path d="M152 150 L128 76 L206 108 Z" fill="#FFC2D6"/>
    <path d="M360 150 L384 76 L306 108 Z" fill="#FFC2D6"/>
    <ellipse cx="256" cy="270" rx="163" ry="139" fill="#FFC2D6"/>
    <circle cx="194" cy="240" r="17" fill="#23264F" stroke="none"/>
    <circle cx="318" cy="240" r="17" fill="#23264F" stroke="none"/>
    <rect x="194" y="292" width="124" height="88" rx="44" fill="#FF9FBE"/>
    <ellipse cx="227" cy="336" rx="13" ry="19" fill="#23264F" stroke="none"/>
    <ellipse cx="285" cy="336" rx="13" ry="19" fill="#23264F" stroke="none"/>
  </g>
</svg>
