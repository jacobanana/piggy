# The fast gate, shared by every pipeline via workflow_call:
# ruff + mypy + backend pytest (real Postgres) + tsc + vitest.

name: Checks (reusable)

on:
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: piggy
          POSTGRES_USER: piggy_user
          POSTGRES_PASSWORD: piggy_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U piggy_user -d piggy"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Typecheck
        run: uv run mypy src

      - name: Tests
        run: uv run pytest
        env:
          TEST_DATABASE_URL: postgresql://piggy_user:piggy_dev_password@localhost:5432/piggy_test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck + build
        working-directory: frontend
        run: npm run build

      - name: Unit tests
        working-directory: frontend
        run: npm test
