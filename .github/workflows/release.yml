# Everything a push to main produces, in one workflow because the checks run
# once and both products ship from the same green commit.
#
# Piggy has two deployment shapes and this builds both:
#
#   GitHub Pages   the frontend alone, persisting to localStorage. The live
#                  product, and it must keep working with no backend at all.
#   the image      backend + built SPA, same-origin, for the self-hosted box.
#
# The box itself is not described here. It runs several small apps and lives in
# https://github.com/jacobanana/mixedmode-deploy - `stacks/piggy` there. This
# workflow publishes an image and names it; that repo records the reference as a
# commit and rolls the stack over, which is what makes a rollback a revert there
# rather than a re-run here.
#
# Required repo secret:
#   DEPLOY_DISPATCH_TOKEN   fine-grained PAT, Actions: read and write, scoped to
#                           jacobanana/mixedmode-deploy and nothing else

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Read by the build and by the dispatch, so the tag pushed and the tag
  # deployed cannot drift.
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  # Once, for both products. Pull requests run the same suite through ci.yml.
  checks:
    uses: ./.github/workflows/checks.yml

  # --- GitHub Pages -----------------------------------------------------------
  # vite.config.ts uses base './' so the same build works at the /piggy/ subpath
  # with zero per-target configuration.
  pages-build:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          # First run enables Pages (source: GitHub Actions) by itself.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Only one Pages rollout at a time; never cancelled, because a cancelled
    # deployment is what leaves the site half-published.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # --- The self-hosted image --------------------------------------------------
  # One image, not two: Dockerfile.backend's `app` target puts the built SPA
  # behind the same FastAPI that serves the API, so the deployed app is
  # same-origin and there is no proxy to configure between them.
  #
  # No path filter. Every source directory ends up in this image, so almost any
  # change rebuilds it and deciding which ones would cost more than it saves.
  image:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # The docker-container driver is required for the type=gha cache export
      # below; the default driver cannot export cache.
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.backend
          target: app
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Ask the deploy repo to roll the stack over
        env:
          # Actions: write rather than the Contents: write a repository_dispatch
          # would need - this token may start a deploy and may not push to the
          # repo that describes every app on the box.
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ env.IMAGE_TAG }}
        run: |
          set -euo pipefail
          echo "dispatching: PIGGY_IMAGE=$IMAGE"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/jacobanana/mixedmode-deploy/actions/workflows/deploy.yml/dispatches \
            -d "$(jq -cn --arg images "PIGGY_IMAGE=$IMAGE" \
                  '{ref: "main", inputs: {stack: "piggy", images: $images}}')"
